spring.application.name=retail

spring.datasource.url=jdbc:h2:file:./data/retail;AUTO_SERVER=TRUE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.sql.init.mode=always
spring.jpa.hibernate.ddl-auto=validate

spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

server.port=8080

# .env 파일의 키를 읽는다. Spring Boot는 .env를 자동으로 읽지 않는다.
# backend/에서 실행하면 저장소 루트의 ../.env, 저장소 루트에서 실행하면 ./.env (둘 다 없으면 무시)
spring.config.import=optional:file:../.env[.properties],optional:file:./.env[.properties]

# Claude AI API Configuration
claude.api.key=${ANTHROPIC_API_KEY:${CLAUDE_API_KEY:}}
claude.api.url=https://api.anthropic.com/v1/messages
claude.model=claude-3-5-sonnet-20241022
